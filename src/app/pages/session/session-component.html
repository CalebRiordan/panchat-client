<div class="form-container" [class.processing]="awaitingResult">
    <form class="user-form" [formGroup]="sessionForm">

        @if(awaitingResult){
        <div class="loading-bar"></div>
        }

        <h1>Login or Sign Up</h1>

        <label for="username">Username</label>
        <div class="input-group">
            <input type="text" name="username" formControlName="username">

            @if (usernameError){
            <div class="form-error">
                {{usernameError}}
            </div>
            }
        </div>

        <label for="password">Password</label>
        <div class="input-group">
            <input [type]="showPassword ? 'text' : 'password'" name="password" formControlName="password">
            <button type="button" class="password-toggle" (click)="togglePasswordVisibility()" tabindex="-1">
                @if (showPassword) {
                    <span class="toggle-icon"><i class="fa-solid fa-eye"></i></span>
                } @else {
                    <span class="toggle-icon"><i class="fa-regular fa-eye-slash"></i></span>
                }
            </button>

            @if (passwordError){
            <div class="form-error">
                {{passwordError}}
            </div>
            }
        </div>

        <div class="button-container">
            <button class="button" [disabled]="sessionForm.invalid || awaitingResult" (click)="onLogin()">
                Login
            </button>

            <button class="button" [disabled]="sessionForm.invalid || awaitingResult" (click)="onSignUp()">
                Sign Up
            </button>
        </div>
    </form>
</div>
